<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,
initial-scale=1.0">

<title>ORION V6</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

html,
body{

width:100%;
height:100%;

overflow:hidden;

background:#000;

font-family:
Arial,sans-serif;
}

#ui{

position:fixed;
inset:0;

width:100%;
height:100%;
}

canvas{

position:absolute;

inset:0;

width:100%;
height:100%;
}

.clock{

position:absolute;

top:40px;

width:100%;

text-align:center;

color:#00d4ff;

font-size:30px;

letter-spacing:5px;
}

.status{

position:absolute;

top:85px;

width:100%;

text-align:center;

color:#00d4ff;

font-size:13px;

letter-spacing:3px;
}
.chat-panel{

position:absolute;

left:50%;

bottom:100px;

transform:
translateX(-50%);

width:90%;

max-width:500px;

height:180px;

overflow:auto;

padding:10px;

border:
1px solid
rgba(0,212,255,.3);

background:
rgba(0,20,40,.4);

color:#00d4ff;
}

.input-area{

position:absolute;

bottom:30px;

left:50%;

transform:
translateX(-50%);

display:flex;

width:90%;

max-width:500px;

gap:10px;
}

.input-area input{

flex:1;

padding:12px;

font-size:16px;

background:
rgba(0,20,40,.8);

border:
1px solid #00d4ff;

color:#00d4ff;
}

.input-area button{

padding:12px;

background:
rgba(0,120,255,.3);

border:
1px solid #00d4ff;

color:#00d4ff;
}
/* ====================
PARTICLE CORE
==================== */

const canvas =
document.getElementById(
"coreCanvas"
);

const ctx =
canvas.getContext("2d");

canvas.width =
window.innerWidth;

canvas.height =
window.innerHeight;

const cx =
canvas.width / 2;

const cy =
canvas.height / 2;

const sphereParticles =
[];

const outerParticles =
[];

const waveRings =
[];

let audioLevel = 0;

/* ====================
CORE PARTICLES
==================== */

for(let i=0;i<300;i++){

sphereParticles.push({

angle:
Math.random()*Math.PI*2,

radius:
40 + Math.random()*40,

size:
Math.random()*3+1

});

}

/* ====================
OUTER PARTICLES
==================== */

for(let i=0;i<80;i++){

outerParticles.push({

angle:
Math.random()*Math.PI*2,

distance:
180 + Math.random()*120,

speed:
0.001 + Math.random()*0.003,

size:
Math.random()*2+1

});

}

/* ====================
WAVES
==================== */

function createWave(){

waveRings.push({

radius:80,

alpha:1

});

}

setInterval(
createWave,
1000
);

/* ====================
DRAW LOOP
==================== */

function drawCore(){

requestAnimationFrame(
drawCore
);

ctx.clearRect(
0,
0,
canvas.width,
canvas.height
);

const pulse =
1 + audioLevel * 0.4;

/* CORE */

sphereParticles.forEach(p=>{

const x =
cx +
Math.cos(p.angle)
*
p.radius
*
pulse;

const y =
cy +
Math.sin(p.angle)
*
p.radius
*
pulse;

ctx.beginPath();

ctx.arc(

x,
y,

p.size,

0,

Math.PI*2

);

ctx.fillStyle =
"#00d4ff";

ctx.shadowColor =
"#00d4ff";

ctx.shadowBlur =
20;

ctx.fill();

});

/* OUTER */

outerParticles.forEach(p=>{

p.angle += p.speed;

const x =
cx +
Math.cos(p.angle)
*
p.distance;

const y =
cy +
Math.sin(p.angle)
*
p.distance;

ctx.beginPath();

ctx.arc(
x,
y,
p.size,
0,
Math.PI*2
);

ctx.fillStyle =
"#00d4ff";

ctx.fill();

});

/* WAVES */

for(
let i =
waveRings.length-1;

i>=0;

i--
){

const w =
waveRings[i];

w.radius +=
2 +
audioLevel*10;

w.alpha -=
0.01;

ctx.beginPath();

ctx.arc(
cx,
cy,
w.radius,
0,
Math.PI*2
);

ctx.strokeStyle =

`rgba(
0,
212,
255,
${w.alpha}
)`;

ctx.lineWidth = 2;

ctx.stroke();

if(w.alpha <=0){

waveRings.splice(
i,
1
);

}

}

}

drawCore();
/* ====================
MIC INPUT
==================== */

navigator.mediaDevices

.getUserMedia({

audio:true

})

.then(stream=>{

const audioContext =

new (
window.AudioContext ||
window.webkitAudioContext
)();

const analyser =
audioContext.createAnalyser();

const source =
audioContext
.createMediaStreamSource(
stream
);

source.connect(
analyser
);

analyser.fftSize =
256;

const dataArray =

new Uint8Array(

analyser.frequencyBinCount

);

function updateAudio(){

requestAnimationFrame(
updateAudio
);

analyser
.getByteFrequencyData(
dataArray
);

let sum = 0;

for(
let i=0;
i<dataArray.length;
i++
){

sum += dataArray[i];

}

audioLevel =
(
sum /
dataArray.length
)
/
255;

}

updateAudio();

})

.catch(err=>{

console.log(
"MIC ERROR",
err
);

});

/* ====================
PARTICLE MOTION
==================== */

setInterval(()=>{

if(audioLevel > 0.05){

waveRings.push({

radius:80,

alpha:
0.8 + audioLevel

});

}

},100);

/* ====================
OUTER REACTION
==================== */

function reactOuterParticles(){

outerParticles.forEach(
p=>{

p.distance +=

Math.sin(

Date.now()/300

+

p.angle

)

*

audioLevel

*

8;

}

);

}

setInterval(
reactOuterParticles,
16
);
/* ====================
CHAT HISTORY
==================== */

const messages = [

{
role:"orion",

text:
"こんにちは、開哉。"
}

];

/* ====================
CHAT RENDER
==================== */

function renderMessages(){

const panel =
document.getElementById(
"chatPanel"
);

panel.innerHTML = "";

messages.forEach(msg=>{

const div =
document.createElement("div");

div.className =
`message ${msg.role}`;

if(
msg.role === "user"
){

div.innerHTML =
`KAIYA > ${msg.text}`;

}
else{

div.innerHTML =
`ORION > ${msg.text}`;

}

panel.appendChild(div);

});

panel.scrollTop =
panel.scrollHeight;

}

/* ====================
SEND MESSAGE
==================== */

async function askAI(){

const input =
document.getElementById(
"userInput"
);

const text =
input.value.trim();

if(!text) return;

/* USER */

messages.push({

role:"user",

text

});

renderMessages();

input.value = "";

/* ORION */

messages.push({

role:"orion",

text:"応答生成中..."

});

renderMessages();

/* GEMINI */

try{

const response =
await fetch(

"https://YOUR-WORKER.workers.dev",

{
method:"POST",

headers:{
"Content-Type":
"application/json"
},

body:JSON.stringify({

message:text

})

}

);

const data =
await response.json();

messages.pop();

messages.push({

role:"orion",

text:data.reply

});

}
catch(err){

messages.pop();

messages.push({

role:"orion",

text:
"通信エラー"

});

}

renderMessages();

}

/* ====================
ENTER KEY
==================== */

document

.getElementById(
"userInput"
)

.addEventListener(

"keydown",

e=>{

if(
e.key === "Enter"
){

askAI();

}

}

);

/* ====================
ORION PERSONALITY
==================== */

/*

Cloudflare Worker側へ

送る人格

--------------------------------

あなたはORIONです。

ユーザー名は開哉です。

未来的なAIです。

親しい相棒として
振る舞います。

簡潔に回答します。

--------------------------------

*/
</style>

</head>

<body>

<div id="ui">

<canvas id="coreCanvas"></canvas>

<div class="clock" id="clock">
00:00:00
</div>

<div class="status">
ORION PARTICLE INTELLIGENCE CORE
</div>

<div
id="chatPanel"
class="chat-panel">
</div>

<div class="input-area">

<input
id="userInput"
type="text"
placeholder="ORIONへ入力..."
>

<button onclick="askAI()">
送信
</button>

</div>

</div>

<script>

/* ====================
CLOCK
==================== */

function updateClock(){

const now = new Date();

const h =
String(
now.getHours()
).padStart(2,"0");

const m =
String(
now.getMinutes()
).padStart(2,"0");

const s =
String(
now.getSeconds()
).padStart(2,"0");

document
.getElementById("clock")
.textContent =

`${h}:${m}:${s}`;

}

updateClock();

setInterval(
updateClock,
1000
);

/* ====================
RESIZE
==================== */

window
.addEventListener(
"resize",
()=>{

canvas.width =
window.innerWidth;

canvas.height =
window.innerHeight;

}

);

/* ====================
CHAT BOOT
==================== */

renderMessages();

/* ====================
INPUT FOCUS
==================== */

document
.getElementById(
"userInput"
)
.focus();

/* ====================
START
==================== */

console.log(
"ORION CORE ONLINE"
);

</script>

</body>
</html>
