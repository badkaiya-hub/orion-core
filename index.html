<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,
initial-scale=1.0">

<title>ORION CORE</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

html,
body{

width:100%;
height:100%;

overflow:hidden;

background:#000;

font-family:
Arial,sans-serif;
}

#ui{

position:relative;

width:100vw;
height:100vh;

overflow:hidden;
}

canvas{

position:absolute;

inset:0;

width:100%;
height:100%;
}

/* CLOCK */

.clock{

position:absolute;

top:40px;

width:100%;

text-align:center;

font-size:34px;

color:#00d4ff;

letter-spacing:4px;

text-shadow:

0 0 10px #00d4ff,
0 0 20px #00d4ff,
0 0 30px #00d4ff;
}

.status{

position:absolute;

top:95px;

width:100%;

text-align:center;

font-size:13px;

letter-spacing:5px;

color:#00d4ff;
}

/* CHAT */

#chatPanel{

position:absolute;

left:50%;

bottom:120px;

transform:
translateX(-50%);

width:90%;

height:160px;

overflow:auto;

padding:12px;

border:
1px solid
rgba(0,212,255,.3);

background:
rgba(0,10,20,.55);

backdrop-filter:
blur(10px);

color:#00d4ff;

font-size:14px;
}

#chatInput{

position:absolute;

left:50%;

bottom:30px;

transform:
translateX(-50%);

width:90%;

display:flex;

gap:10px;
}

#chatInput input{

flex:1;

padding:14px;

font-size:16px;

background:#001018;

border:
1px solid #00d4ff;

color:#00d4ff;
}

#chatInput button{

padding:14px;

background:#00243a;

border:
1px solid #00d4ff;

color:#00d4ff;
}

.message{

margin-bottom:10px;
}

</style>
</style>

</head>

<body>

<div id="ui">

<div
id="clock"
class="clock">
00:00:00
</div>

<div
class="status">
ORION PARTICLE INTELLIGENCE CORE
</div>

<canvas
id="coreCanvas">
</canvas>

<div id="chatPanel">

<div class="message">
ORION ＞ ONLINE
</div>

<div class="message">
ORION ＞ PARTICLE CORE ACTIVE
</div>

</div>

<div id="chatInput">

<input
id="userInput"
type="text"
placeholder="ORIONへ入力...">

<button
id="sendButton">

送信

</button>

</div>

</div>

<script>

/* =====================
CANVAS
===================== */

const canvas =
document.getElementById(
"coreCanvas"
);

const ctx =
canvas.getContext(
"2d"
);

function resize(){

canvas.width =
window.innerWidth;

canvas.height =
window.innerHeight;

}

resize();

window.addEventListener(
"resize",
resize
);

/* =====================
CENTER
===================== */

function getCenterX(){

return canvas.width / 2;

}

function getCenterY(){

return (
canvas.height / 2
) - 80;

}

/* =====================
AUDIO
===================== */

let audioLevel = 0;

/* =====================
CORE PARTICLES
===================== */

const particles = [];

for(
let i=0;
i<700;
i++
){

particles.push({

theta:
Math.random()
*
Math.PI
*
2,

phi:
Math.random()
*
Math.PI,

radius:
45 +
Math.random()*45,

offset:
Math.random()*1000,

size:
1 +
Math.random()*2

});

}

/* =====================
OUTER PARTICLES
===================== */

const dust = [];

for(
let i=0;
i<200;
i++
){

dust.push({

angle:
Math.random()*Math.PI*2,

distance:
180+
Math.random()*250,

speed:
0.0005+
Math.random()*0.002,

size:
Math.random()*2+0.5

});

}

/* =====================
WAVES
===================== */

const waves = [];

setInterval(()=>{

waves.push({

radius:80,

alpha:1

});

},1200);
/* =====================
DRAW ENGINE
===================== */

function draw(){

requestAnimationFrame(draw);

ctx.clearRect(
0,
0,
canvas.width,
canvas.height
);

const cx =
getCenterX();

const centerY =
getCenterY();

const t =
Date.now() * 0.001;

/* =====================
PARTICLE SPHERE
===================== */

particles.forEach(p=>{

const theta =

p.theta +

(t * 0.25)

+

Math.sin(
t + p.offset
)
*
0.35;

const phi =

p.phi +

Math.cos(
t + p.offset
)
*
0.18;

const r =

p.radius +

Math.sin(
t*2 +
p.offset
)
*
8

+

(
audioLevel * 35
);

/* 3D座標 */

const x3d =

Math.sin(phi)

*

Math.cos(theta)

*
r;

const y3d =

Math.cos(phi)

*
r;

const z3d =

Math.sin(phi)

*

Math.sin(theta)

*
r;

/* 遠近感 */

const perspective =

400 /
(
400 + z3d
);

const x =

cx +

x3d *
perspective;

const y =

centerY +

y3d *
perspective;

const size =

p.size *
perspective;

/* 粒子 */

ctx.beginPath();

ctx.arc(
x,
y,
size,
0,
Math.PI*2
);

ctx.fillStyle =

`rgba(
120,
220,
255,
${0.15 + perspective}
)`;

ctx.shadowColor =
"#00d4ff";

ctx.shadowBlur =
12;

ctx.fill();

});

/* =====================
CORE NUCLEUS
===================== */

ctx.beginPath();

ctx.arc(
cx,
centerY,
18 +
audioLevel*8,
0,
Math.PI*2
);

ctx.fillStyle =
"#7fdfff";

ctx.shadowColor =
"#00d4ff";

ctx.shadowBlur =
40;

ctx.fill();

/* =====================
OUTER DUST
===================== */

dust.forEach(p=>{

p.angle +=
p.speed;

const distance =

p.distance +

Math.sin(
t + p.angle
)
*
10

+

audioLevel*30;

const x =

cx +

Math.cos(
p.angle
)
*
distance;

const y =

centerY +

Math.sin(
p.angle
)
*
distance;

ctx.beginPath();

ctx.arc(
x,
y,
p.size,
0,
Math.PI*2
);

ctx.fillStyle =
"rgba(0,212,255,.6)";

ctx.shadowBlur =
6;

ctx.fill();

});

/* =====================
WAVE SYSTEM
===================== */

for(
let i =
waves.length - 1;

i >= 0;

i--
){

const w =
waves[i];

w.radius +=

2 +

audioLevel * 8;

w.alpha -=
0.01;

ctx.beginPath();

ctx.arc(
cx,
centerY,
w.radius,
0,
Math.PI*2
);

ctx.strokeStyle =

`rgba(
0,
212,
255,
${w.alpha}
)`;

ctx.lineWidth = 2;

ctx.stroke();

if(
w.alpha <= 0
){

waves.splice(i,1);

}

}

}

draw();
/* =====================
MIC INPUT
===================== */

navigator.mediaDevices

.getUserMedia({
audio:true
})

.then(stream=>{

const audioContext =

new (
window.AudioContext ||
window.webkitAudioContext
)();

const analyser =
audioContext.createAnalyser();

const source =
audioContext
.createMediaStreamSource(
stream
);

source.connect(
analyser
);

analyser.fftSize =
256;

const dataArray =
new Uint8Array(
analyser.frequencyBinCount
);

function updateAudio(){

requestAnimationFrame(
updateAudio
);

analyser
.getByteFrequencyData(
dataArray
);

let sum = 0;

for(
let i=0;
i<dataArray.length;
i++
){

sum += dataArray[i];

}

audioLevel =

(
sum /
dataArray.length
)
/
255;

}

updateAudio();

})

.catch(()=>{

audioLevel = 0;

});

/* =====================
CLOCK
===================== */

function updateClock(){

const now =
new Date();

document
.getElementById(
"clock"
)
.textContent =

now.toLocaleTimeString(
"ja-JP",
{
hour12:false
}
);

}

updateClock();

setInterval(
updateClock,
1000
);

/* =====================
CHAT
===================== */

const panel =
document.getElementById(
"chatPanel"
);

function addMessage(text){

const div =
document.createElement(
"div"
);

div.className =
"message";

div.innerText =
text;

panel.appendChild(
div
);

panel.scrollTop =
panel.scrollHeight;

}

function sendMessage(){

const input =
document.getElementById(
"userInput"
);

const text =
input.value.trim();

if(!text){
return;
}

addMessage(
`KAIYA ＞ ${text}`
);

addMessage(
"ORION ＞ Gemini接続待機中"
);

input.value = "";

}

document
.getElementById(
"sendButton"
)
.addEventListener(
"click",
sendMessage
);

document
.getElementById(
"userInput"
)
.addEventListener(
"keydown",
e=>{

if(
e.key === "Enter"
){

sendMessage();

}

}
);

/* =====================
BOOT MESSAGE
===================== */

addMessage(
"ORION ＞ ONLINE"
);

addMessage(
"ORION ＞ PARTICLE CORE ACTIVE"
);

</script>

</body>

</html>
