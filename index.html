<!DOCTYPE html>
<html lang="ja">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0">

<title>ORION CORE</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

html,
body{

width:100%;
height:100%;

overflow:hidden;

background:#000;
}

canvas{

display:block;

width:100%;
height:100%;
}

.clock{

position:absolute;

top:40px;

width:100%;

text-align:center;

font-size:34px;

color:#00d4ff;

letter-spacing:4px;

font-family:sans-serif;

text-shadow:

0 0 10px #00d4ff,
0 0 20px #00d4ff;
}

.status{

position:absolute;

top:90px;

width:100%;

text-align:center;

font-size:13px;

letter-spacing:4px;

color:#00d4ff;

font-family:sans-serif;
}

</style>

</head>

<body>

<div
id="clock"
class="clock">
00:00:00
</div>

<div
class="status">

ORION PARTICLE CORE

</div>

<canvas
id="coreCanvas">
</canvas>

<script>

const canvas =
document.getElementById(
"coreCanvas"
);

const ctx =
canvas.getContext(
"2d"
);

function resize(){

canvas.width =
window.innerWidth;

canvas.height =
window.innerHeight;

}

resize();

window.addEventListener(
"resize",
resize
);

const particles = [];

for(
let i=0;
i<600;
i++
){

particles.push({

theta:
Math.random()
*
Math.PI*2,

phi:
Math.random()
*
Math.PI,

radius:
80 +

Math.random()*20,

offset:
Math.random()*1000

});

}

let audioLevel = 0;
/* =====================
DRAW ENGINE
===================== */

function draw(){

requestAnimationFrame(
draw
);

ctx.clearRect(
0,
0,
canvas.width,
canvas.height
);

const cx =
canvas.width / 2;

const cy =
canvas.height / 2;

/* 上方向へ少し移動 */

const centerY =
cy - 60;

const t =
Date.now() * 0.001;

/* =====================
PARTICLE SPHERE
===================== */

particles.forEach(p=>{

const theta =

p.theta +

(t * 0.3)

+

Math.sin(
t +
p.offset
)

*
0.4;

const phi =

p.phi +

Math.cos(
t +
p.offset
)

*
0.2;

/* 粒子自体も呼吸 */

const r =

p.radius +

Math.sin(
t*2 +
p.offset
)
*
8

+

(
audioLevel * 35
);

/* 3D座標 */

const x3d =

Math.sin(phi)

*

Math.cos(theta)

*
r;

const y3d =

Math.cos(phi)

*
r;

const z3d =

Math.sin(phi)

*

Math.sin(theta)

*
r;

/* 遠近感 */

const perspective =

400 /
(
400 + z3d
);

const x =

cx +

x3d *
perspective;

const y =

centerY +

y3d *
perspective;

const size =

perspective *
2.5;

/* 描画 */

ctx.beginPath();

ctx.arc(

x,
y,

size,

0,

Math.PI*2

);

ctx.fillStyle =

`rgba(
0,
212,
255,
${0.2 + perspective}
)`;

ctx.shadowColor =
"#00d4ff";

ctx.shadowBlur =
15;

ctx.fill();

});
/* =====================
OUTER PARTICLES
===================== */

outerParticles.forEach(p=>{

p.angle += p.speed;

const x =

cx +

Math.cos(
p.angle
)

*

(
p.distance +
audioLevel*40
);

const y =

centerY +

Math.sin(
p.angle
)

*

(
p.distance +
audioLevel*40
);

ctx.beginPath();

ctx.arc(
x,
y,
p.size,
0,
Math.PI*2
);

ctx.fillStyle =
"rgba(0,212,255,.8)";

ctx.shadowBlur =
8;

ctx.fill();

});

/* =====================
WAVE SYSTEM
===================== */

for(

let i =
waves.length - 1;

i >= 0;

i--

){

const w = waves[i];

w.radius +=
2 + audioLevel*10;

w.alpha -= 0.01;

ctx.beginPath();

ctx.arc(
cx,
centerY,
w.radius,
0,
Math.PI*2
);

ctx.strokeStyle =

`rgba(
0,
212,
255,
${w.alpha}
)`;

ctx.lineWidth = 2;

ctx.stroke();

if(
w.alpha <= 0
){

waves.splice(i,1);

}

}

}

draw();

/* =====================
MIC INPUT
===================== */

navigator.mediaDevices
.getUserMedia({
audio:true
})
.then(stream=>{

const audioContext =
new (
window.AudioContext ||
window.webkitAudioContext
)();

const analyser =
audioContext.createAnalyser();

const source =
audioContext
.createMediaStreamSource(
stream
);

source.connect(
analyser
);

analyser.fftSize =
256;

const dataArray =
new Uint8Array(
analyser.frequencyBinCount
);

function updateAudio(){

requestAnimationFrame(
updateAudio
);

analyser
.getByteFrequencyData(
dataArray
);

let sum = 0;

for(
let i=0;
i<dataArray.length;
i++
){

sum += dataArray[i];

}

audioLevel =

(
sum /
dataArray.length
)
/
255;

}

updateAudio();

})
.catch(()=>{

audioLevel = 0;

});

/* =====================
CLOCK
===================== */

function updateClock(){

const now =
new Date();

document
.getElementById(
"clock"
)
.textContent =

now.toLocaleTimeString(
"ja-JP",
{
hour12:false
}
);

}

updateClock();

setInterval(
updateClock,
1000
);

</script>

</body>
</html>
