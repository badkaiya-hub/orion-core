<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,
initial-scale=1.0">

<title>ORION CORE</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

html,
body{

width:100%;
height:100%;

overflow:hidden;

background:#000;

font-family:
Arial,sans-serif;

}

/* ====================
MAIN UI
==================== */

#mainUI{

position:fixed;

inset:0;

width:100vw;
height:100vh;
}

/* ====================
CLOCK
==================== */

.clock{

position:absolute;

top:50px;

width:100%;

text-align:center;

color:#00d4ff;

font-size:30px;

letter-spacing:5px;

text-shadow:

0 0 10px #00d4ff,

0 0 20px #00d4ff;
}

/* ====================
STATUS
==================== */

.status{

position:absolute;

top:95px;

width:100%;

text-align:center;

color:#00d4ff;

font-size:13px;

letter-spacing:3px;

opacity:.8;
}

/* ====================
HUD
==================== */

.hud-line-x{

position:absolute;

top:50%;

width:100%;

height:1px;

background:

linear-gradient(
90deg,
transparent,
#00d4ff,
transparent
);

opacity:.25;
}

.hud-line-y{

position:absolute;

left:50%;

width:1px;

height:100%;

background:

linear-gradient(
180deg,
transparent,
#00d4ff,
transparent
);

opacity:.25;
}
/* ====================
CORE
==================== */

.core{

position:absolute;

left:50%;
top:50%;

width:140px;
height:140px;

border-radius:50%;

transform:
translate(-50%,-50%);

background:

radial-gradient(
circle,
rgba(0,212,255,.95),
rgba(0,80,255,.2)
);

box-shadow:

0 0 20px #00d4ff,

0 0 60px #00d4ff,

0 0 120px rgba(0,212,255,.9);

opacity:0;
}

/* ====================
RINGS
==================== */

.ring{

position:absolute;

left:50%;
top:50%;

transform:
translate(-50%,-50%);

border-radius:50%;

pointer-events:none;
}

.ring1{

width:360px;
height:360px;

opacity:0;

border-top:3px solid #00d4ff;
border-bottom:3px solid #00d4ff;

filter:
drop-shadow(0 0 12px #00d4ff);
}

.ring2{

width:280px;
height:280px;

opacity:0;

border-left:3px solid #00d4ff;
border-right:3px solid #00d4ff;

filter:
drop-shadow(0 0 10px #00d4ff);
}

.ring3{

width:220px;
height:220px;

opacity:0;

border:
1px solid rgba(0,212,255,.4);
}

/* ====================
CHAT PANEL
==================== */

.chat-panel{

position:absolute;

bottom:100px;

left:50%;

transform:
translateX(-50%);

width:90%;

max-width:500px;

height:140px;

border:

1px solid
rgba(0,212,255,.3);

background:

rgba(0,20,40,.4);

backdrop-filter:
blur(8px);

overflow:auto;

padding:12px;

color:#00d4ff;

font-size:14px;

box-shadow:
0 0 20px
rgba(0,212,255,.2);
}

/* ====================
INPUT
==================== */

.input-area{

position:absolute;

bottom:30px;

left:50%;

transform:
translateX(-50%);

width:90%;

max-width:500px;

display:flex;

gap:10px;
}

.input-area input{

flex:1;

padding:10px;

background:
rgba(0,20,40,.8);

border:

1px solid
#00d4ff;

color:#00d4ff;

outline:none;
}

.input-area button{

padding:10px 18px;

background:
rgba(0,120,255,.3);

border:

1px solid
#00d4ff;

color:#00d4ff;

cursor:pointer;
}

/* ====================
PARTICLES
==================== */

.particle{

position:absolute;

width:3px;
height:3px;

background:#00d4ff;

border-radius:50%;

box-shadow:

0 0 8px #00d4ff,

0 0 16px #00d4ff;

opacity:.8;
}
/* ====================
CORE BOOT
==================== */

.core-online{

animation:
coreBoot .8s ease-out forwards,
pulse 2.2s ease-in-out infinite .8s;

}

@keyframes coreBoot{

0%{

opacity:0;

transform:
translate(-50%,-50%)
scale(0);

}

60%{

opacity:1;

transform:
translate(-50%,-50%)
scale(1.25);

}

100%{

opacity:1;

transform:
translate(-50%,-50%)
scale(1);

}

}

/* ====================
RING BOOT
==================== */

.ring1.ring-online{

animation:
ringBoot .8s ease-out forwards,
spin1 12s linear infinite .8s;

}

.ring2.ring-online{

animation:
ringBoot .8s ease-out forwards,
spin2 8s linear infinite reverse .8s;

}

.ring3.ring-online{

animation:
ringBoot .8s ease-out forwards,
spin3 20s linear infinite .8s;

}

@keyframes ringBoot{

0%{

opacity:0;

transform:
translate(-50%,-50%)
scale(0);

}

70%{

opacity:1;

transform:
translate(-50%,-50%)
scale(1.15);

}

100%{

opacity:1;

transform:
translate(-50%,-50%)
scale(1);

}

}

/* ====================
RING ROTATION
==================== */

@keyframes spin1{

from{

transform:
translate(-50%,-50%)
rotateX(75deg)
rotateZ(0deg);

}

to{

transform:
translate(-50%,-50%)
rotateX(75deg)
rotateZ(360deg);

}

}

@keyframes spin2{

from{

transform:
translate(-50%,-50%)
rotateY(75deg)
rotateZ(0deg);

}

to{

transform:
translate(-50%,-50%)
rotateY(75deg)
rotateZ(360deg);

}

}

@keyframes spin3{

from{

transform:
translate(-50%,-50%)
rotate(0deg);

}

to{

transform:
translate(-50%,-50%)
rotate(360deg);

}

}

/* ====================
PULSE
==================== */

@keyframes pulse{

0%{

transform:
translate(-50%,-50%)
scale(1);

}

50%{

transform:
translate(-50%,-50%)
scale(1.08);

}

100%{

transform:
translate(-50%,-50%)
scale(1);

}

}

/* ====================
CHAT EFFECT
==================== */

.message{

margin-bottom:10px;

padding:8px;

border-left:
2px solid #00d4ff;

background:
rgba(0,120,255,.08);

}

.you{

color:#8fdcff;

}

.orion{

color:#00d4ff;

}

/* API応答中 */

.typing{

animation:
blink 1s infinite;

}

@keyframes blink{

50%{

opacity:.3;

}

}

</style>

</head>
</style>

</head>

<body>

<div id="mainUI">

<div class="clock" id="clock">
00:00:00
</div>

<div class="status">
ORION SYSTEM ONLINE
</div>

<div class="hud-line-x"></div>
<div class="hud-line-y"></div>

<div class="ring ring1"></div>
<div class="ring ring2"></div>
<div class="ring ring3"></div>

<div class="core"></div>

<!-- CHAT -->

<div id="chatPanel" class="chat-panel">

<div class="message orion">
ORION >
待機中...
</div>

</div>

<div class="input-area">

<input
id="userInput"
type="text"
placeholder="ORIONへ入力..."
>

<button onclick="askAI()">
送信
</button>

</div>

</div>

<script>

/* ====================
CLOCK
==================== */

function updateClock(){

const now = new Date();

const h =
String(now.getHours()).padStart(2,"0");

const m =
String(now.getMinutes()).padStart(2,"0");

const s =
String(now.getSeconds()).padStart(2,"0");

document
.getElementById("clock")
.textContent =
`${h}:${m}:${s}`;

}

updateClock();

setInterval(
updateClock,
1000
);

/* ====================
PARTICLES
==================== */

for(let i=0;i<40;i++){

const p =
document.createElement("div");

p.className =
"particle";

p.style.left =
Math.random()*100+"vw";

p.style.top =
Math.random()*100+"vh";

document.body.appendChild(p);

}

/* ====================
STARTUP
==================== */

document
.querySelector(".core")
.classList.add(
"core-online"
);

document
.querySelector(".ring1")
.classList.add(
"ring-online"
);

document
.querySelector(".ring2")
.classList.add(
"ring-online"
);

document
.querySelector(".ring3")
.classList.add(
"ring-online"
);

/* ====================
AI CHAT
==================== */

async function askAI(){

const input =
document.getElementById(
"userInput"
);

const panel =
document.getElementById(
"chatPanel"
);

const text =
input.value.trim();

if(!text) return;

/* USER */

panel.innerHTML += `

<div class="message you">
KAIYA >
${text}
</div>

`;

input.value = "";

/* ORION */

panel.innerHTML += `

<div id="typing"
class="message orion typing">

ORION >
応答生成中...

</div>

`;

panel.scrollTop =
panel.scrollHeight;

/* =====================================
ここにAI接続を入れる
===================================== */

/*
将来ここへ

const response =
await fetch(...)

を追加

*/

setTimeout(()=>{

document
.getElementById(
"typing"
)
.remove();

panel.innerHTML += `

<div class="message orion">

ORION >

現在はスタンドアロンモードです。

AI接続ポイントは
準備済みです。

</div>

`;

panel.scrollTop =
panel.scrollHeight;

},1000);

}

document
.getElementById("userInput")
.addEventListener(
"keydown",
e=>{

if(e.key==="Enter"){

askAI();

}

}
);

</script>

</body>

</html>
