<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>ORION CORE</title>

<style>
body{
  margin:0;
  background:#000;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}

.core{
  width:200px;
  height:200px;
  border-radius:50%;
  border:4px solid #00d4ff;
  box-shadow:
  0 0 20px #00d4ff,
  0 0 60px #00d4ff;
  animation:pulse 2s infinite;
}

@keyframes pulse{
  0%{transform:scale(1);}
  50%{transform:scale(1.15);}
  100%{transform:scale(1);}
}
</style>

</head>
<body>

<div class="core"></div>

</body>
</html>
