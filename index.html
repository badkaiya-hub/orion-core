<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>ORION CORE</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
width:100vw;
height:100vh;
overflow:hidden;

display:flex;
justify-content:center;
align-items:center;

background:
radial-gradient(circle at center,
rgba(0,120,255,.15),
#000000 65%);

font-family:Arial,sans-serif;
}

/* 時計 */

.clock{
position:absolute;
top:70px;

width:100%;

text-align:center;

color:#00d4ff;

font-size:32px;

letter-spacing:4px;

text-shadow:
0 0 10px #00d4ff,
0 0 20px #00d4ff;
}

/* ステータス */

.status{
position:absolute;
top:120px;

width:100%;

text-align:center;

color:#00d4ff;

font-size:13px;

letter-spacing:3px;

opacity:.8;
}

/* コア */

.core{

position:absolute;

width:180px;
height:180px;

border-radius:50%;

background:
radial-gradient(
circle,
rgba(0,212,255,.9),
rgba(0,90,255,.2)
);

box-shadow:
0 0 20px #00d4ff,
0 0 40px #00d4ff,
0 0 90px rgba(0,212,255,.8);

animation:
pulse 2s ease-in-out infinite;
}

/* リング共通 */

.ring{
position:absolute;
border-radius:50%;
}

/* 外リング */

.ring1{

width:340px;
height:340px;

border-top:2px solid #00d4ff;
border-bottom:2px solid #00d4ff;

animation:
spin1 10s linear infinite;

filter:
drop-shadow(0 0 10px #00d4ff);
}

/* 中リング */

.ring2{

width:280px;
height:280px;

border-left:2px solid #00d4ff;
border-right:2px solid #00d4ff;

opacity:.8;

animation:
spin2 6s linear infinite reverse;
}

/* 内リング */

.ring3{

width:230px;
height:230px;

border:1px solid rgba(0,212,255,.4);

animation:
spin3 20s linear infinite;
}

/* 中央ライン */

.hud-horizontal{
position:absolute;

width:100vw;
height:1px;

background:
rgba(0,212,255,.15);
}

.hud-vertical{
position:absolute;

width:1px;
height:100vh;

background:
rgba(0,212,255,.15);
}

/* アニメ */

@keyframes pulse{

0%{
transform:scale(1);
}

50%{
transform:scale(1.08);
}

100%{
transform:scale(1);
}

}

@keyframes spin1{

from{
transform:
rotateX(75deg)
rotateZ(0deg);
}

to{
transform:
rotateX(75deg)
rotateZ(360deg);
}

}

@keyframes spin2{

from{
transform:
rotateY(75deg)
rotateZ(0deg);
}

to{
transform:
rotateY(75deg)
rotateZ(360deg);
}

}

@keyframes spin3{

from{
transform:rotate(0deg);
}

to{
transform:rotate(360deg);
}

}

/* スキャンライン */

.scan{

position:absolute;

width:100%;
height:2px;

background:

linear-gradient(
90deg,
transparent,
#00d4ff,
transparent
);

animation:
scanMove 6s linear infinite;

opacity:.4;
}

@keyframes scanMove{

0%{
top:0;
}

100%{
top:100%;
}

}

</style>
</head>

<body>

<div class="clock" id="clock"></div>

<div class="status">
ORION SYSTEM ONLINE
</div>

<div class="hud-horizontal"></div>
<div class="hud-vertical"></div>

<div class="ring ring1"></div>
<div class="ring ring2"></div>
<div class="ring ring3"></div>

<div class="core"></div>

<div class="scan"></div>

<script>

function updateClock(){

const time =
new Date().toLocaleTimeString(
"ja-JP",
{
hour12:false,
timeZone:"Asia/Tokyo"
}
);

document.getElementById("clock")
.textContent = time;
}

updateClock();

setInterval(
updateClock,
1000
);

</script>

</body>
</html>
