<!DOCTYPE html>
<html lang="ja">
<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,
initial-scale=1.0">

<title>ORION CORE</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

html,
body{

width:100%;
height:100%;

overflow:hidden;

background:#000;

font-family:
Arial,sans-serif;

}

#ui{

position:relative;

width:100vw;
height:100vh;

overflow:hidden;
}

canvas{

position:absolute;

inset:0;

width:100%;
height:100%;

display:block;
}

/* CLOCK */

.clock{

position:absolute;

top:40px;

width:100%;

text-align:center;

color:#00d4ff;

font-size:32px;

letter-spacing:4px;

text-shadow:

0 0 10px #00d4ff,

0 0 20px #00d4ff;
}

.status{

position:absolute;

top:90px;

width:100%;

text-align:center;

color:#00d4ff;

font-size:13px;

letter-spacing:3px;
}

/* CHAT */

.chat-panel{

position:absolute;

left:50%;

bottom:110px;

transform:
translateX(-50%);

width:90%;

height:180px;

border:
1px solid
rgba(0,212,255,.3);

background:
rgba(0,10,20,.55);

backdrop-filter:
blur(10px);

overflow:auto;

padding:10px;

color:#00d4ff;
}

.input-area{

position:absolute;

left:50%;

bottom:30px;

transform:
translateX(-50%);

width:90%;

display:flex;

gap:10px;
}

.input-area input{

flex:1;

padding:14px;

font-size:16px;

background:#001018;

border:
1px solid #00d4ff;

color:#00d4ff;
}

.input-area button{

padding:14px;

background:#00243a;

border:
1px solid #00d4ff;

color:#00d4ff;
}

.message{

margin-bottom:8px;
}

</style>
</style>

</head>

<body>

<div id="ui">

<canvas
id="coreCanvas">
</canvas>

<div
class="clock"
id="clock">
00:00:00
</div>

<div
class="status">
ORION PARTICLE INTELLIGENCE CORE
</div>

<div
id="chatPanel"
class="chat-panel">
</div>

<div
class="input-area">

<input
id="userInput"
type="text"
placeholder="ORIONへ入力...">

<button
id="sendButton">

送信

</button>

</div>

</div>

<script>

/* =====================
CANVAS
===================== */

const canvas =
document.getElementById(
"coreCanvas"
);

const ctx =
canvas.getContext(
"2d"
);

function resize(){

canvas.width =
window.innerWidth;

canvas.height =
window.innerHeight;

}

resize();

window.addEventListener(
"resize",
resize
);

/* =====================
CENTER
===================== */

function getCenterX(){

return canvas.width / 2;

}

function getCenterY(){

return (
canvas.height / 2
) - 80;

}

/* =====================
AUDIO
===================== */

let audioLevel = 0;

/* =====================
CORE PARTICLES
===================== */

const particles = [];

for(
let i=0;
i<700;
i++
){

particles.push({

theta:
Math.random()
*
Math.PI
*
2,

phi:
Math.random()
*
Math.PI,

radius:
40 +
Math.random()*45,

orbit:
Math.random()*1000,

size:
1 +
Math.random()*2

});

}

/* =====================
OUTER PARTICLES
===================== */

const outerParticles =
[];

for(
let i=0;
i<150;
i++
){

outerParticles.push({

angle:
Math.random()
*
Math.PI
*
2,

distance:
170 +
Math.random()*220,

speed:
0.001 +
Math.random()*0.003,

size:
1 +
Math.random()*2

});

}

/* =====================
WAVES
===================== */

const waves = [];

function createWave(){

waves.push({

radius:70,

alpha:1

});

}

setInterval(
createWave,
1000
);
/* =====================
DRAW ENGINE
===================== */

function draw(){

requestAnimationFrame(
draw
);

ctx.clearRect(
0,
0,
canvas.width,
canvas.height
);

const cx =
getCenterX();

const cy =
getCenterY();

const t =
Date.now()
*
0.001;

/* =====================
PARTICLE SPHERE
===================== */

particles.forEach(p=>{

const theta =

p.theta +

t * 0.3 +

Math.sin(
t + p.orbit
)
*
0.4;

const phi =

p.phi +

Math.cos(
t + p.orbit
)
*
0.15;

const radius =

p.radius +

Math.sin(
t*2 +
p.orbit
)
*
8

+

(audioLevel * 30);

const x3d =

Math.sin(phi)

*
Math.cos(theta)

*
radius;

const y3d =

Math.cos(phi)

*
radius;

const z3d =

Math.sin(phi)

*
Math.sin(theta)

*
radius;

/* Perspective */

const scale =

300 /

(
300 + z3d
);

const x =

cx +

x3d * scale;

const y =

cy +

y3d * scale;

const size =

p.size * scale;

const alpha =

0.15 +

scale;

ctx.beginPath();

ctx.arc(

x,
y,
size,

0,
Math.PI * 2

);

ctx.fillStyle =

`rgba(
0,
212,
255,
${alpha}
)`;

ctx.shadowColor =
"#00d4ff";

ctx.shadowBlur =
12;

ctx.fill();

});

/* =====================
OUTER PARTICLES
===================== */

outerParticles.forEach(p=>{

p.angle +=
p.speed;

const x =

cx +

Math.cos(
p.angle
)

*

(
p.distance +

audioLevel*40
);

const y =

cy +

Math.sin(
p.angle
)

*

(
p.distance +

audioLevel*40
);

ctx.beginPath();

ctx.arc(

x,
y,

p.size,

0,

Math.PI*2

);

ctx.fillStyle =
"rgba(0,212,255,.8)";

ctx.shadowBlur =
8;

ctx.fill();

});

/* =====================
WAVE SYSTEM
===================== */

for(

let i =
waves.length - 1;

i >= 0;

i--

){

const w =
waves[i];

w.radius +=

2 +

audioLevel*10;

w.alpha -=
0.01;

ctx.beginPath();

ctx.arc(

cx,
cy,

w.radius,

0,

Math.PI*2

);

ctx.strokeStyle =

`rgba(
0,
212,
255,
${w.alpha}
)`;

ctx.lineWidth = 2;

ctx.stroke();

if(
w.alpha <= 0
){

waves.splice(
i,
1
);

}

}

}

draw();
<body>

<div id="bootScreen">

<div id="bootText">
WELCOME KAIYA
</div>

</div>

<div id="mainUI">

<div class="clock" id="clock">
00:00:00
</div>

<div class="status">
ORION SYSTEM ONLINE
</div>

<div class="hud-line-x"></div>
<div class="hud-line-y"></div>

<div class="scan"></div>

<div class="ring ring1"></div>
<div class="ring ring2"></div>
<div class="ring ring3"></div>

<div class="core"></div>

</div>

<script>

/* 時計 */

function updateClock(){

const now = new Date();

const h =
String(now.getHours()).padStart(2,"0");

const m =
String(now.getMinutes()).padStart(2,"0");

const s =
String(now.getSeconds()).padStart(2,"0");

document
.getElementById("clock")
.textContent =
`${h}:${m}:${s}`;

}

updateClock();

setInterval(
updateClock,
1000
);

/* 粒子生成 */

for(let i=0;i<60;i++){

const p =
document.createElement("div");

p.className =
"particle";

p.style.left =
Math.random()*100+"vw";

p.style.top =
Math.random()*100+"vh";

p.style.animationDuration =
(5+Math.random()*8)+"s";

document
.body
.appendChild(p);

}

/* 起動シーケンス */

const bootText =
document
.getElementById(
"bootText"
);

const bootScreen =
document
.getElementById(
"bootScreen"
);

const mainUI =
document
.getElementById(
"mainUI"
);

setTimeout(()=>{

bootText.textContent =
"INITIALIZING...";

},1500);

setTimeout(()=>{

bootText.textContent =
"SYSTEM CHECK...";

},3000);

setTimeout(()=>{

bootText.textContent =
"ORION ONLINE";

},4500);

setTimeout(()=>{

bootScreen.style.display =
"none";

mainUI.style.display =
"block";

/* CORE */

document
.querySelector(".core")
.classList.add(
"core-online"
);

/* RINGS */

setTimeout(()=>{

document
.querySelector(".ring3")
.classList.add(
"ring-online"
);

},300);

setTimeout(()=>{

document
.querySelector(".ring2")
.classList.add(
"ring-online"
);

},700);

setTimeout(()=>{

document
.querySelector(".ring1")
.classList.add(
"ring-online"
);

},1100);

},6000);

/* 音声反応 */

navigator
.mediaDevices
.getUserMedia({
audio:true
})
.then(stream=>{

const audioContext =
new AudioContext();

const analyser =
audioContext.createAnalyser();

const source =
audioContext
.createMediaStreamSource(
stream
);

source.connect(
analyser
);

analyser.fftSize = 256;

const data =
new Uint8Array(
analyser.frequencyBinCount
);

function audioLoop(){

requestAnimationFrame(
audioLoop
);

analyser
.getByteFrequencyData(
data
);

let volume = 0;

for(
let i=0;
i<data.length;
i++
){
volume += data[i];
}

volume =
volume / data.length;

const glow =
10 + volume * 0.6;

const scale =
1 + volume / 500;

document
.querySelector(".core")
.style.transform =
`translate(-50%,-50%) scale(${scale})`;

document
.querySelector(".core")
.style.boxShadow =
`0 0 ${glow}px #00d4ff,
0 0 ${glow*3}px #00d4ff,
0 0 ${glow*5}px rgba(0,212,255,.8)`;

document
.querySelector(".ring1")
.style.boxShadow =
`0 0 ${glow}px #00d4ff,
0 0 ${glow*2}px #00d4ff`;

document
.querySelector(".ring2")
.style.boxShadow =
`0 0 ${glow}px #00d4ff,
0 0 ${glow*1.5}px #00d4ff`;

}

audioLoop();

})
.catch(error=>{

console.log(
"Microphone Error",
error
);

});

</script>

</body>

</html>
