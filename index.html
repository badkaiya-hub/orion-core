<!DOCTYPE html>
<html lang="ja">
<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1.0">

<title>ORION DEBUG</title>

<style>

html,
body{

margin:0;
padding:0;

width:100%;
height:100%;

overflow:hidden;

background:#000;
}

canvas{

width:100%;
height:100%;

display:block;
}

</style>

</head>

<body>

<canvas id="coreCanvas"></canvas>

<script>

const canvas =
document.getElementById(
"coreCanvas"
);

const ctx =
canvas.getContext("2d");

function resize(){

canvas.width =
window.innerWidth;

canvas.height =
window.innerHeight;

}

resize();

window.addEventListener(
"resize",
resize
);

function draw(){

ctx.clearRect(
0,
0,
canvas.width,
canvas.height
);

const cx =
canvas.width / 2;

const cy =
canvas.height / 2;

ctx.beginPath();

ctx.arc(
cx,
cy,
80,
0,
Math.PI * 2
);

ctx.fillStyle =
"#00d4ff";

ctx.shadowColor =
"#00d4ff";

ctx.shadowBlur =
30;

ctx.fill();

requestAnimationFrame(
draw
);

}

draw();

</script>

</body>
</html>
