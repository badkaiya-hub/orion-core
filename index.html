<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>ORION CORE</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  overflow:hidden;
  height:100vh;
  width:100vw;
  display:flex;
  justify-content:center;
  align-items:center;

  background:
  radial-gradient(
    circle at center,
    rgba(0,120,255,.15),
    #000 60%
  );

  font-family:Arial,sans-serif;
}

/* 時計 */

.clock{
  position:absolute;
  top:80px;
  width:100%;

  text-align:center;

  color:#00d4ff;

  font-size:32px;

  letter-spacing:4px;

  text-shadow:
  0 0 10px #00d4ff,
  0 0 20px #00d4ff,
  0 0 40px #00d4ff;
}

/* ステータス */

.status{
  position:absolute;

  top:130px;

  width:100%;

  text-align:center;

  color:#00d4ff;

  font-size:14px;

  letter-spacing:3px;

  opacity:.8;
}


/* コア */

.core{
  position:absolute;

  width:180px;
  height:180px;

  border-radius:50%;

  background:
  radial-gradient(
    circle,
    rgba(0,212,255,.9),
    rgba(0,80,180,.2)
  );

  box-shadow:
  0 0 20px #00d4ff,
  0 0 50px #00d4ff,
  0 0 100px #00d4ff;

  animation:pulse 2s ease-in-out infinite;
}


/* 共通リング */

.ring{
  position:absolute;
  border-radius:50%;
}


/* 外側リング */

.ring1{
  width:340px;
  height:340px;

  border-top:2px solid #00d4ff;
  border-bottom:2px solid #00d4ff;

  transform-style:preserve-3d;

  animation:spin1 10s linear infinite;

  filter:
  drop-shadow(0 0 12px #00d4ff);
}


/* 中リング */

.ring2{
  width:280px;
  height:280px;

  border-left:2px solid #00d4ff;
  border-right:2px solid #00d4ff;

  opacity:.7;

  animation:
  spin2 6s linear infinite reverse;

  filter:
  drop-shadow(0 0 10px #00d4ff);
}


/* 内リング */

.ring3{
  width:230px;
  height:230px;

  border:
  1px solid rgba(0,212,255,.3);

  animation:
  spin3 20s linear infinite;
}


/* パーティクル */

.particle{
  position:absolute;

  width:4px;
  height:4px;

  border-radius:50%;

  background:#00d4ff;

  box-shadow:
  0 0 10px #00d4ff;

  opacity:.8;
}
/* =======================
3D RINGS
======================= */

.ring{

position:absolute;

left:50%;
top:50%;

border-radius:50%;

transform:
translate(-50%,-50%);

pointer-events:none;

z-index:5;
}

/* OUTER */

.ring1{

width:360px;
height:360px;

opacity:0;

border-top:4px solid #00d4ff;
border-bottom:4px solid #00d4ff;

box-shadow:
0 0 10px #00d4ff,
0 0 30px #00d4ff;

}

/* MIDDLE */

.ring2{

width:300px;
height:300px;

opacity:0;

border-left:4px solid #00d4ff;
border-right:4px solid #00d4ff;

box-shadow:
0 0 10px #00d4ff,
0 0 20px #00d4ff;
}

/* INNER */

.ring3{

width:240px;
height:240px;

opacity:0;

border:2px solid rgba(0,212,255,.4);

box-shadow:
0 0 8px #00d4ff;
}
/* =======================
RING ROTATION
======================= */

@keyframes spin1{

from{
transform:
translate(-50%,-50%)
rotateX(75deg)
rotate(0deg);
}

to{
transform:
translate(-50%,-50%)
rotateX(75deg)
rotate(360deg);
}

}

@keyframes spin2{

from{
transform:
translate(-50%,-50%)
rotateY(75deg)
rotate(0deg);
}

to{
transform:
translate(-50%,-50%)
rotateY(75deg)
rotate(360deg);
}

}

@keyframes spin3{

from{
transform:
translate(-50%,-50%)
rotate(0deg);
}

to{
transform:
translate(-50%,-50%)
rotate(360deg);
}

}

/* =======================
CORE PULSE
======================= */

@keyframes pulse{

0%{
transform:
translate(-50%,-50%)
scale(1);
}

50%{
transform:
translate(-50%,-50%)
scale(1.08);
}

100%{
transform:
translate(-50%,-50%)
scale(1);
}

}

/* =======================
CORE BOOT
======================= */

.core-online{

animation:
coreBoot .8s ease-out forwards,
pulse 2s ease-in-out infinite .8s;
}

@keyframes coreBoot{

0%{

opacity:0;

transform:
translate(-50%,-50%)
scale(0);

}

60%{

opacity:1;

transform:
translate(-50%,-50%)
scale(1.2);

}

100%{

opacity:1;

transform:
translate(-50%,-50%)
scale(1);

}

}

/* =======================
RING BOOT
======================= */

.ring1.ring-online{

animation:
ringBoot .8s ease-out forwards,
spin1 10s linear infinite .8s;
}

.ring2.ring-online{

animation:
ringBoot .8s ease-out forwards,
spin2 6s linear infinite .8s reverse;
}

.ring3.ring-online{

animation:
ringBoot .8s ease-out forwards,
spin3 20s linear infinite .8s;
}

@keyframes ringBoot{

0%{

opacity:0;

transform:
translate(-50%,-50%)
scale(0);

}

70%{

opacity:1;

transform:
translate(-50%,-50%)
scale(1.15);

}

100%{

opacity:1;

transform:
translate(-50%,-50%)
scale(1);

}

}
</style>

</head>

<body>

<div id="bootScreen">

<div id="bootText">
WELCOME KAIYA
</div>

</div>

<div id="mainUI">

<div class="clock" id="clock">
00:00:00
</div>

<div class="status">
ORION SYSTEM ONLINE
</div>

<div class="hud-line"></div>

<div class="ring ring1"></div>
<div class="ring ring2"></div>
<div class="ring ring3"></div>

<div class="core"></div>

</div>

<script>

function updateClock(){

const now = new Date();

const h =
String(now.getHours()).padStart(2,"0");

const m =
String(now.getMinutes()).padStart(2,"0");

const s =
String(now.getSeconds()).padStart(2,"0");

document.getElementById("clock").textContent =
`${h}:${m}:${s}`;

}

updateClock();

setInterval(updateClock,1000);

/* 粒子生成 */

for(let i=0;i<80;i++){

const p=document.createElement("div");

p.className="particle";

p.style.left =
Math.random()*100+"vw";

p.style.top =
Math.random()*100+"vh";

p.style.animationDuration =
(5+Math.random()*10)+"s";

document.body.appendChild(p);

}

/* 起動演出 */

const bootText =
document.getElementById("bootText");

const bootScreen =
document.getElementById("bootScreen");

const mainUI =
document.getElementById("mainUI");

setTimeout(()=>{

bootText.textContent =
"INITIALIZING...";

},1500);

setTimeout(()=>{

bootText.textContent =
"SYSTEM CHECK...";

},3000);

setTimeout(()=>{

bootText.textContent =
"ORION ONLINE";

},4500);

setTimeout(()=>{

bootScreen.style.display =
"none";

mainUI.style.display =
"block";

document
.querySelector(".core")
.classList.add("core-online");

setTimeout(()=>{

document
.querySelector(".ring3")
.classList.add("ring-online");

},300);

setTimeout(()=>{

document
.querySelector(".ring2")
.classList.add("ring-online");

},800);

setTimeout(()=>{

document
.querySelector(".ring1")
.classList.add("ring-online");

},1300);

},6000);

</script>

</body>
</html>
