<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ORION CORE</title>

<style>

body{
margin:0;
overflow:hidden;
height:100vh;

display:flex;
justify-content:center;
align-items:center;

background:#000;
font-family:Arial,sans-serif;
}

/* 時計 */
.clock{
position:absolute;
top:80px;

width:100%;
text-align:center;

color:#00d4ff;

font-size:32px;

letter-spacing:4px;

text-shadow:
0 0 10px #00d4ff,
0 0 20px #00d4ff;
}

/* 状態表示 */
.status{
position:absolute;
top:130px;

width:100%;
text-align:center;

color:#00d4ff;

font-size:14px;

letter-spacing:3px;

opacity:0.8;
}

/* コア */
.core{

width:220px;
height:220px;

border-radius:50%;

border:4px solid #00d4ff;

box-shadow:
0 0 20px #00d4ff,
0 0 40px #00d4ff,
0 0 80px #00d4ff;

animation:pulse 2s infinite;
}

/* 脈動 */
@keyframes pulse{

0%{
transform:scale(1);
}

50%{
transform:scale(1.12);
}

100%{
transform:scale(1);
}

}

</style>
</head>

<body>

<div class="clock" id="clock">
00:00:00
</div>

<div class="status">
ORION SYSTEM ONLINE
</div>

<div class="core"></div>

<script>

function updateClock(){

const now = new Date();

const h = String(now.getHours()).padStart(2,"0");
const m = String(now.getMinutes()).padStart(2,"0");
const s = String(now.getSeconds()).padStart(2,"0");

document.getElementById("clock").innerText =
`${h}:${m}:${s}`;

}

updateClock();

setInterval(updateClock,1000);

</script>

</body>
</html>
