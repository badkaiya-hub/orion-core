<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1.0">

<title>ORION CORE</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

width:100vw;
height:100vh;

overflow:hidden;

background:
radial-gradient(
circle at center,
rgba(0,120,255,.15),
#000 65%
);

font-family:
Arial,
sans-serif;
}

/* =======================
BOOT SCREEN
======================= */

#bootScreen{

position:fixed;

inset:0;

background:#000;

display:flex;
justify-content:center;
align-items:center;

z-index:9999;
}

#bootText{

color:#00d4ff;

font-size:30px;

letter-spacing:4px;

text-shadow:
0 0 10px #00d4ff,
0 0 20px #00d4ff,
0 0 40px #00d4ff;
}

/* =======================
MAIN UI
======================= */

#mainUI{

display:none;

position:fixed;

inset:0;

width:100vw;
height:100vh;
}

/* =======================
CLOCK
======================= */

.clock{

position:absolute;

top:70px;

width:100%;

text-align:center;

color:#00d4ff;

font-size:32px;

letter-spacing:4px;

text-shadow:
0 0 10px #00d4ff,
0 0 20px #00d4ff;
}

/* =======================
STATUS
======================= */

.status{

position:absolute;

top:120px;

width:100%;

text-align:center;

color:#00d4ff;

font-size:13px;

letter-spacing:3px;

opacity:.8;

text-shadow:
0 0 10px #00d4ff;
}

/* =======================
HUD LINES
======================= */

.hud-horizontal{

position:absolute;

left:0;
top:50%;

width:100%;
height:1px;

background:
linear-gradient(
90deg,
transparent,
#00d4ff,
transparent
);

opacity:.3;
}

.hud-vertical{

position:absolute;

left:50%;
top:0;

width:1px;
height:100%;

background:
linear-gradient(
180deg,
transparent,
#00d4ff,
transparent
);

opacity:.15;
}
/* ====================
CORE
==================== */

.core{

position:absolute;

left:50%;
top:50%;

width:140px;
height:140px;

border-radius:50%;

transform:
translate(-50%,-50%);

background:

radial-gradient(
circle,
rgba(0,212,255,.95),
rgba(0,80,255,.2)
);

box-shadow:

0 0 20px #00d4ff,

0 0 60px #00d4ff,

0 0 120px rgba(0,212,255,.9);

opacity:0;
}

/* ====================
RINGS
==================== */

.ring{

position:absolute;

left:50%;
top:50%;

transform:
translate(-50%,-50%);

border-radius:50%;

pointer-events:none;
}

.ring1{

width:360px;
height:360px;

opacity:0;

border-top:3px solid #00d4ff;
border-bottom:3px solid #00d4ff;

filter:
drop-shadow(0 0 12px #00d4ff);
}

.ring2{

width:280px;
height:280px;

opacity:0;

border-left:3px solid #00d4ff;
border-right:3px solid #00d4ff;

filter:
drop-shadow(0 0 10px #00d4ff);
}

.ring3{

width:220px;
height:220px;

opacity:0;

border:
1px solid rgba(0,212,255,.4);
}

/* ====================
PARTICLES
==================== */

.particle{

position:absolute;

width:3px;
height:3px;

background:#00d4ff;

border-radius:50%;

box-shadow:

0 0 8px #00d4ff,

0 0 16px #00d4ff;

opacity:.8;
}

/* ====================
SCAN LINE
==================== */

.scan{

position:absolute;

left:0;

width:100%;

height:2px;

background:

linear-gradient(
90deg,
transparent,
#00d4ff,
transparent
);

opacity:.35;

animation:
scanMove 5s linear infinite;
}

@keyframes scanMove{

0%{
top:0%;
}

100%{
top:100%;
}

}
/* ====================
CORE BOOT
==================== */

.core-online{

animation:
coreBoot .8s ease-out forwards,
pulse 2.2s ease-in-out infinite .8s;
}

@keyframes coreBoot{

0%{

opacity:0;

transform:
translate(-50%,-50%)
scale(0);

}

60%{

opacity:1;

transform:
translate(-50%,-50%)
scale(1.25);

}

100%{

opacity:1;

transform:
translate(-50%,-50%)
scale(1);

}

}

/* ====================
RING BOOT
==================== */

.ring1.ring-online{

animation:
ringBoot .8s ease-out forwards,
spin1 12s linear infinite .8s;
}

.ring2.ring-online{

animation:
ringBoot .8s ease-out forwards,
spin2 8s linear infinite reverse .8s;
}

.ring3.ring-online{

animation:
ringBoot .8s ease-out forwards,
spin3 20s linear infinite .8s;
}

@keyframes ringBoot{

0%{

opacity:0;

transform:
translate(-50%,-50%)
scale(0);

}

70%{

opacity:1;

transform:
translate(-50%,-50%)
scale(1.15);

}

100%{

opacity:1;

transform:
translate(-50%,-50%)
scale(1);

}

}

/* ====================
RING ROTATION
==================== */

@keyframes spin1{

from{

transform:
translate(-50%,-50%)
rotateX(75deg)
rotateZ(0deg);

}

to{

transform:
translate(-50%,-50%)
rotateX(75deg)
rotateZ(360deg);

}

}

@keyframes spin2{

from{

transform:
translate(-50%,-50%)
rotateY(75deg)
rotateZ(0deg);

}

to{

transform:
translate(-50%,-50%)
rotateY(75deg)
rotateZ(360deg);

}

}

@keyframes spin3{

from{

transform:
translate(-50%,-50%)
rotate(0deg);

}

to{

transform:
translate(-50%,-50%)
rotate(360deg);

}

}

/* ====================
CORE PULSE
==================== */

@keyframes pulse{

0%{

transform:
translate(-50%,-50%)
scale(1);

}

50%{

transform:
translate(-50%,-50%)
scale(1.08);

}

100%{

transform:
translate(-50%,-50%)
scale(1);

}

}

</style>

</head>
</style>

</head>

<body>

<div id="bootScreen">

<div id="bootText">
WELCOME KAIYA
</div>

</div>

<div id="mainUI">

<div class="clock" id="clock">
00:00:00
</div>

<div class="status">
ORION SYSTEM ONLINE
</div>

<div class="hud-horizontal"></div>
<div class="hud-vertical"></div>

<div class="ring ring1"></div>
<div class="ring ring2"></div>
<div class="ring ring3"></div>

<div class="core"></div>

</div>

<script>

/* 時計 */

function updateClock(){

const time=
new Date().toLocaleTimeString(
"ja-JP",
{
hour12:false,
timeZone:"Asia/Tokyo"
}
);

document
.getElementById("clock")
.textContent=time;

}

updateClock();
setInterval(updateClock,1000);

/* 粒子 */

for(let i=0;i<80;i++){

const p=
document.createElement("div");

p.className=
"particle";

p.style.left=
Math.random()*100+"vw";

p.style.top=
Math.random()*100+"vh";

p.style.animationDuration=
(5+Math.random()*10)+"s";

document.body.appendChild(p);

}

/* 起動シーケンス */

const bootText=
document.getElementById(
"bootText"
);

const bootScreen=
document.getElementById(
"bootScreen"
);

const mainUI=
document.getElementById(
"mainUI"
);

setTimeout(()=>{

bootText.textContent=
"INITIALIZING...";

},1500);

setTimeout(()=>{

bootText.textContent=
"SYSTEM CHECK...";

},3000);

setTimeout(()=>{

bootText.textContent=
"ORION ONLINE";

},4500);

setTimeout(()=>{

bootScreen.style.display=
"none";

mainUI.style.display=
"block";

document
.querySelector(".core")
.classList.add(
"core-online"
);

setTimeout(()=>{

document
.querySelector(".ring3")
.classList.add(
"ring-online"
);

},300);

setTimeout(()=>{

document
.querySelector(".ring2")
.classList.add(
"ring-online"
);

},800);

setTimeout(()=>{

document
.querySelector(".ring1")
.classList.add(
"ring-online"
);

},1300);

},6000);

/* 音量反応 */

navigator
.mediaDevices
.getUserMedia({
audio:true
})
.then(stream=>{

const audioContext=
new AudioContext();

const analyser=
audioContext.createAnalyser();

const source=
audioContext
.createMediaStreamSource(
stream
);

source.connect(
analyser
);

analyser.fftSize=256;

const data=
new Uint8Array(
analyser.frequencyBinCount
);

function audioLoop(){

requestAnimationFrame(
audioLoop
);

analyser
.getByteFrequencyData(
data
);

let volume=0;

for(
let i=0;
i<data.length;
i++
){
volume+=data[i];
}

volume=
volume/data.length;

const glow=
10+volume*0.6;

document
.querySelector(".ring1")
.style.boxShadow=
`0 0 ${glow}px #00d4ff,
0 0 ${glow*2}px #00d4ff`;

document
.querySelector(".ring2")
.style.boxShadow=
`0 0 ${glow}px #00d4ff,
0 0 ${glow*1.5}px #00d4ff`;

document
.querySelector(".core")
.style.boxShadow=
`0 0 ${glow}px #00d4ff,
0 0 ${glow*3}px #00d4ff,
0 0 ${glow*5}px rgba(0,212,255,.8)`;

}

audioLoop();

})
.catch(error=>{

console.log(
"Microphone Error",
error
);

});

</script>

</body>

</html>
